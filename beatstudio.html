// ═══════════════════════════════════════════════
// PHONE SHELL + APP ROUTER
// ═══════════════════════════════════════════════
function BeatStudioApp() {
  const [route,             setRoute]             = useState('home');
  const [animDir,           setAnimDir]           = useState('forward');
  const [prevRoute,         setPrevRoute]         = useState(null);
  const [sessionOrigin,     setSessionOrigin]     = useState('home');
  const [sessionBackTarget, setSessionBackTarget] = useState('home');
  const [beat,              setBeat]              = useState(null);
  const [takes,             setTakes]             = useState([]);
  const [exportOpts,        setExportOpts]        = useState(null);
  const [beats,             setBeats]             = useState(BEATS_DATA);
  const [sessions,          setSessions]          = useState(SESSIONS_SEED);
  const [activeSessionId,   setActiveSessionId]   = useState(null);
  const [sessionName,       setSessionName]       = useState('SESSION · APR 20');
  const [toast,             setToast]             = useState({ msg:'', visible:false });
  const [isRecording, setIsRecording] = useState(false);
  const [isCounting,  setIsCounting]  = useState(false);
  const [darkMode,    setDarkMode]    = useState(()=>{ try{return localStorage.getItem('bs-theme')==='dark'}catch{return false} });
  const recCtrlRef = useRef({ start:null, stop:null });
  const toastTimerRef = useRef();

  // Apply data-theme to phone-body whenever darkMode changes
  React.useEffect(()=>{
    const body = document.querySelector('.phone-body');
    if(body){ body.setAttribute('data-theme', darkMode ? 'dark' : 'light'); }
    try{ localStorage.setItem('bs-theme', darkMode ? 'dark' : 'light'); }catch{}
  }, [darkMode]);

  const activeTab = route==='home'?'home'
    : route==='library'||route==='beat'?'library'
    : route==='sessions-list'?'sessions'
    : (route==='session'||route==='record'||route==='export'||route==='exported')?'sessions'
    : 'home';

  const navigate = (next, dir='forward') => {
    if(route==='record' && next!=='record'){
      setIsRecording(false);
      setIsCounting(false);
      recCtrlRef.current = { start:null, stop:null };
    }
    setAnimDir(dir); setPrevRoute(route); setRoute(next);
  };

  const showToast = msg => {
    clearTimeout(toastTimerRef.current);
    setToast({ msg, visible:true });
    toastTimerRef.current = setTimeout(()=>setToast(t=>({...t,visible:false})), 2200);
  };

  const persistSession = (id, newTakes, newName) => {
    setSessions(prev=>prev.map(s=>s.id===id?{...s,takes:newTakes,name:newName,updatedAt:'APR 20'}:s));
  };

  const openSession = s => {
    setSessionOrigin(route);
    setSessionBackTarget(route);
    setBeat(s.beat);
    setTakes(s.takes);
    setSessionName(s.name);
    setActiveSessionId(s.id);
    navigate('session','forward');
  };

  const startNewSession = () => {
    setSessionOrigin('home');
    setSessionBackTarget('record');
    setActiveSessionId(null);
    setBeat(null);
    setTakes([]);
    setSessionName('NEW SESSION');
    navigate('library','forward');
  };

  const handleFinishTake = ({ durationMs }) => {
    const newTake = {
      id:`t${Date.now()}`, label:null,
      durationMs: durationMs||142000,
      enabled:true, volume:80, favorite:false,
      seed: 7+takes.length*13,
    };
    const updatedTakes = [...takes, newTake];
    setTakes(updatedTakes);
    if(activeSessionId){
      persistSession(activeSessionId, updatedTakes, sessionName);
    } else if(beat){
      const newSess = {
        id:`s${Date.now()}`,
        name: sessionName||'NEW SESSION',
        beatId: beat.id, beat:{...beat},
        takes: updatedTakes,
        createdAt:'APR 20', updatedAt:'APR 20',
      };
      setSessions(prev=>[newSess,...prev]);
      setActiveSessionId(newSess.id);
    }
    setSessionBackTarget('record');
    navigate('session','forward');
    showToast('Take saved');
  };

  const updateTake = (id, patch) => {
    const updated = takes.map(t=>t.id===id?{...t,...patch}:t);
    setTakes(updated);
    if(activeSessionId) persistSession(activeSessionId, updated, sessionName);
  };

  const deleteTake = id => {
    const updated = takes.filter(t=>t.id!==id);
    setTakes(updated);
    if(activeSessionId) persistSession(activeSessionId, updated, sessionName);
  };

  const handleRenameSession = name => {
    setSessionName(name);
    if(activeSessionId) persistSession(activeSessionId, takes, name);
  };

  const deleteSession = id => {
    setSessions(prev=>prev.filter(s=>s.id!==id));
    if(activeSessionId===id){ setActiveSessionId(null); setTakes([]); setBeat(null); }
  };

  const addBeat = () => {
    const nb = { id:`b${Date.now()}`, title:'NEW TRACK', bpm:100, key:'Dm', format:'MP3', duration:180, side:'A', stamp:'NEW' };
    setBeats(prev=>[nb,...prev]); setBeat(nb); navigate('beat','forward');
  };

  const goTab = tab => {
    if(tab==='home')     navigate('home','back');
    if(tab==='library')  navigate('library', route==='home'?'forward':'back');
    if(tab==='sessions') navigate('sessions-list','forward');
  };

  const animClass = animDir==='back' ? 'screen-slide-back' : 'screen-slide-in';
  // Tab bar hidden on record, export, exported screens
  const showTabBar = !['export','exported'].includes(route);

  let screen;
  if(route==='home')
    screen = <HomeScreen
      beats={beats} sessions={sessions}
      onOpenSession={openSession}
      onNewSession={startNewSession}
      onGoLibrary={b=>{ if(b&&b.id){setBeat(b);navigate('beat','forward');}else navigate('library','forward'); }}
      onGoSessions={()=>navigate('sessions-list','forward')}
      onImport={addBeat}
      showToast={showToast}
      darkMode={darkMode}
      onToggleDark={()=>setDarkMode(d=>!d)}
    />;
  else if(route==='library')
    screen = <LibraryScreen
      beats={beats}
      onOpenBeat={b=>{setBeat(b);navigate('beat','forward');}}
      onAddBeat={addBeat}
      showToast={showToast}
      darkMode={darkMode}
      onToggleDark={()=>setDarkMode(d=>!d)}
    />;
  else if(route==='beat')
    screen = <BeatDetailScreen
      beat={beat}
      onBack={()=>navigate(prevRoute==='home'?'home':'library','back')}
      onStart={b=>{setBeat(b);setTakes([]);setActiveSessionId(null);setSessionName('NEW SESSION');navigate('record','forward');}}
      showToast={showToast}
    />;
  else if(route==='record')
    screen = <RecordScreen
      beat={beat} takes={takes}
      onBack={()=>navigate(takes.length?'session':'beat','back')}
      onFinishTake={handleFinishTake}
      showToast={showToast}
      onRecordingChange={setIsRecording}
      onCountingChange={setIsCounting}
      recCtrlRef={recCtrlRef}
    />;
  else if(route==='session')
    screen = <SessionScreen
      beat={beat} takes={takes}
      onBack={()=>navigate(sessionBackTarget||'home','back')}
      onNewTake={()=>{ setSessionBackTarget('record'); navigate('record','forward'); }}
      onExport={()=>navigate('export','forward')}
      onUpdateTake={updateTake}
      onDeleteTake={deleteTake}
      showToast={showToast}
      sessionName={sessionName}
      onRenameSession={handleRenameSession}
    />;
  else if(route==='sessions-list')
    screen = <SessionsListScreen
      sessions={sessions}
      onBack={()=>navigate('home','back')}
      onOpenSession={openSession}
      onNewSession={startNewSession}
      onDeleteSession={deleteSession}
      showToast={showToast}
    />;
  else if(route==='export')
    screen = <ExportScreen
      beat={beat} takes={takes}
      onBack={()=>navigate('session','back')}
      onExport={opts=>{exportCount++;setExportOpts(opts);navigate('exported','forward');}}
    />;
  else if(route==='exported')
    screen = <ExportSuccessScreen
      beat={beat} exportOpts={exportOpts}
      onDone={()=>navigate(sessionOrigin||'home','back')}
      showToast={showToast}
    />;

  const [settingsOpen, setSettingsOpen] = useState(false);

  const SettingsSheet = () => (
    <Sheet open={settingsOpen} onClose={()=>setSettingsOpen(false)} title="SETTINGS">
      {/* ── Appearance ── */}
      <div style={{marginBottom:4}}>
        <div style={{fontFamily:'var(--font-mono)',fontSize:9,fontWeight:700,letterSpacing:'.2em',color:'var(--ink-2)',marginBottom:10}}>APPEARANCE</div>
        <button
          className={`theme-toggle${darkMode?' dark-active':''}`}
          style={{width:'100%',justifyContent:'space-between'}}
          onClick={()=>{setSettingsOpen(false);setDarkMode(d=>!d);}}>
          <span style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:14}}>{darkMode?'🌙':'☀️'}</span>
            {darkMode ? 'Studio Mode · ON' : 'Studio Mode · OFF'}
          </span>
          <span style={{fontFamily:'var(--font-mono)',fontSize:10,fontWeight:800,
            color:darkMode?'var(--spot)':'var(--ink-2)',letterSpacing:'.1em'}}>
            {darkMode?'DARK':'LIGHT'}
          </span>
        </button>
      </div>
      {/* ── Audio ── */}
      <div style={{marginTop:16,paddingTop:16,borderTop:'1px dashed rgba(23,22,26,.25)'}}>
        <div style={{fontFamily:'var(--font-mono)',fontSize:9,fontWeight:700,letterSpacing:'.2em',color:'var(--ink-2)',marginBottom:10}}>AUDIO</div>
        <MenuRow icon="mic"     label="Input Device"    hint="Built-in Microphone"   onClick={()=>showToast('Input — coming soon')}/>
        <MenuRow icon="cassette"label="Sample Rate"     hint="44.1 kHz"              onClick={()=>showToast('Sample rate — coming soon')}/>
        <MenuRow icon="list"    label="Default Format"  hint="WAV 16-bit"            onClick={()=>showToast('Format — coming soon')}/>
      </div>
      {/* ── About ── */}
      <div style={{marginTop:16,paddingTop:16,borderTop:'1px dashed rgba(23,22,26,.25)'}}>
        <div style={{fontFamily:'var(--font-mono)',fontSize:9,fontWeight:700,letterSpacing:'.2em',color:'var(--ink-2)',marginBottom:10}}>ABOUT</div>
        <MenuRow icon="more"   label="BeatStudio"       hint="v1.0 · build 042"      onClick={()=>showToast('BeatStudio v1.0')}/>
        <MenuRow icon="share"  label="Privacy Policy"   hint="beatstudio.app/privacy" onClick={()=>showToast('Privacy — coming soon')}/>
      </div>
    </Sheet>
  );

  const TabBar = () => (
    <div className="tab-bar">
      <button className={`tab-btn${activeTab==='home'?' active':''}`} onClick={()=>goTab('home')}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke={activeTab==='home'?'var(--spot)':'var(--ink-2)'} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span className="tab-label" style={{color:activeTab==='home'?'var(--spot)':'var(--ink-2)'}}>Home</span>
      </button>

      <button className={`tab-btn${activeTab==='library'?' active':''}`} onClick={()=>goTab('library')}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke={activeTab==='library'?'var(--spot)':'var(--ink-2)'} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="1"/>
          <circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/>
          <rect x="7" y="16" width="10" height="1.5"/>
        </svg>
        <span className="tab-label" style={{color:activeTab==='library'?'var(--spot)':'var(--ink-2)'}}>Beats</span>
      </button>

      <button className="tab-btn" style={{position:'relative'}} onClick={()=>{
        if(route==='record'){
          if(isRecording){ recCtrlRef.current.stop&&recCtrlRef.current.stop(); }
          else if(!isCounting){ recCtrlRef.current.start&&recCtrlRef.current.start(); }
        } else {
          if(beat){ navigate('record','forward'); }
          else { startNewSession(); showToast('Pick a beat first'); }
        }
      }}>
        <div style={{
          width:52,height:52,borderRadius:'50%',
          background: isRecording ? 'var(--spot)' : route==='record' ? 'var(--ink-0)' : 'var(--ink-0)',
          border: isRecording ? '3px solid var(--spot-dk)' : '3px solid var(--ink-0)',
          display:'flex',alignItems:'center',justifyContent:'center',
          boxShadow: isRecording
            ? '0 0 20px rgba(217,58,28,.9), 0 0 40px rgba(217,58,28,.4), 3px 3px 0 var(--spot-dk)'
            : route==='record'
            ? '0 0 10px rgba(217,58,28,.3), 3px 3px 0 var(--spot-dk)'
            : '3px 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.15)',
          marginTop:-18,
          transition:'all 120ms var(--ease)',
          animation: isRecording ? 'rec-pulse 1.1s infinite ease-in-out' : 'none',
          cursor: isCounting ? 'wait' : 'pointer',
        }}>
          {isRecording ? (
            // Stop icon (square) when recording
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#F0EBDF" stroke="none">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
          ) : (
            // Rec circle when not recording
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#F0EBDF" stroke="none">
              <circle cx="12" cy="12" r="7"/>
            </svg>
          )}
        </div>
        <span className="tab-label" style={{
          color: isRecording ? 'var(--spot)' : route==='record' ? 'var(--spot)' : 'var(--ink-0)',
          marginTop:-2,
          animation: isRecording ? 'blink 1s infinite' : 'none',
        }}>{isRecording ? '● REC' : 'Record'}</span>
      </button>

      <button className={`tab-btn${activeTab==='sessions'?' active':''}`} style={{position:'relative'}} onClick={()=>goTab('sessions')}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke={activeTab==='sessions'?'var(--spot)':'var(--ink-2)'} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
        <span className="tab-label" style={{color:activeTab==='sessions'?'var(--spot)':'var(--ink-2)'}}>Sessions</span>
        {sessions.length>0&&(
          <div style={{position:'absolute',top:8,right:'calc(50% - 18px)',width:14,height:14,borderRadius:'50%',background:'var(--spot)',border:'2px solid var(--paper-0)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:7,fontWeight:800,color:'#F0EBDF'}}>{Math.min(sessions.length,9)}</span>
          </div>
        )}
      </button>

      <button className="tab-btn" onClick={()=>setSettingsOpen(true)}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="var(--ink-2)" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span className="tab-label" style={{color:'var(--ink-2)'}}>Settings</span>
      </button>
    </div>
  );

  return (
    <div className="phone-wrap">
      <div className="phone-body">
        <div className="phone-notch"/>
        <div className="phone-statusbar"
          style={{color:'var(--ink-0)'}}>
          <span style={{fontVariantNumeric:'tabular-nums'}}>9:41</span>
          <span style={{display:'inline-flex',gap:6,alignItems:'center'}}>
            <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" fill="currentColor"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="currentColor" fill="none"/><rect x="2" y="2" width="18" height="8" fill="currentColor"/></svg>
          </span>
        </div>
        <div key={route} className={`phone-screen ${animClass}`}
          style={{bottom:showTabBar?68:0}}>
          {screen}
        </div>
        {showTabBar && <TabBar/>}
        <SettingsSheet/>
        {toast.msg && <Toast msg={toast.msg} visible={toast.visible}/>}
      </div>
      <div className="phone-label">BEATSTUDIO ▸ {route.toUpperCase()} {darkMode?'· STUDIO':''}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BeatStudioApp/>);
</script>
</body>
</html>
